name: Terraform CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - 'dev'
          - 'qa'
          - 'prod'
      aws_region:
        description: 'AWS Region'
        required: true
        type: string
        default: 'us-east-1'
      role_arn:
        description: 'AWS Role ARN (overrides default pipeline role)'
        required: false
        type: string
      fail_on_security_issues:
        description: 'Fail pipeline on security/linting issues'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: terraform-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: false

# Plan job needs PR write for comments; apply needs only OIDC + read.
# Permissions are scoped per-job below — no global over-permissioning.
permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    # Run on PR events and manual dispatch so apply can consume the saved plan artifact on merge.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'

    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    env:
      AWS_REGION: ${{ github.event.inputs.aws_region || secrets.AWS_REGION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set AWS Role and Environment
        id: set-role
        run: |
          # Use input role ARN or default pipeline role ARN
          if [ -n "${{ github.event.inputs.role_arn }}" ]; then
            ROLE_ARN="${{ github.event.inputs.role_arn }}"
            echo "Using input role ARN"
          else
            ROLE_ARN="${{ secrets.PIPELINE_ROLE_ARN }}"
            echo "Using pipeline role ARN"
          fi
          
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV
          echo "Selected ROLE_ARN: $ROLE_ARN"
          
          if [ -z "$ROLE_ARN" ] || [ "$ROLE_ARN" = "" ]; then
            echo "ERROR: No role ARN configured. Please set PIPELINE_ROLE_ARN secret or provide role_arn input."
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Select .tfvars File and Detect Environment
        run: |
          # Find first .tfvars file
          TFVARS_FILE=$(find . -name "*.tfvars" -type f | head -1)
          
          # Initialize environment from manual input
          ENV="${{ github.event.inputs.environment }}"
          BRANCH="${{ github.ref_name }}"
          
          if [ -n "$TFVARS_FILE" ]; then
            echo "ENV_FILE=$TFVARS_FILE" >> $GITHUB_ENV
            echo "Using tfvars file: $TFVARS_FILE"
            
            # Try to detect environment from tfvars file (check both 'environment' and 'env')
            if [ -f "$TFVARS_FILE" ]; then
              DETECTED_ENV=$(grep -E '^[[:space:]]*(environment|env)[[:space:]]*=' "$TFVARS_FILE" | sed 's/.*=[[:space:]]*"\([^"]*\)".*/\1/' | head -1)
              if [ -n "$DETECTED_ENV" ]; then
                ENV="$DETECTED_ENV"
                echo "Detected environment from tfvars: $DETECTED_ENV"
              fi
            fi
          else
            echo "No .tfvars files found - continuing without variable file"
          fi
          
          # Use branch name if no environment detected from tfvars or manual input
          if [ -z "$ENV" ]; then
            ENV="$BRANCH"
            echo "Using branch name as environment: $ENV"
          fi
          
          echo "ENVIRONMENT=$ENV" >> $GITHUB_ENV
          echo "Final environment: $ENV"

      - name: Ensure S3 Bucket Exists
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        if: env.TF_STATE_BUCKET != ''
        run: |
          BUCKET_NAME="$TF_STATE_BUCKET"
          echo "🪣 Creating S3 bucket: $BUCKET_NAME"
          
          # Check if bucket exists
          if aws s3 ls "s3://$BUCKET_NAME" 2>/dev/null; then
            echo "✅ Bucket $BUCKET_NAME already exists"
          else
            echo "Creating bucket $BUCKET_NAME..."
            # Create bucket
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3 mb "s3://$BUCKET_NAME"
            else
              aws s3 mb "s3://$BUCKET_NAME" --region "${{ env.AWS_REGION }}"
            fi
            
            if [ $? -ne 0 ]; then
              echo "❌ Failed to create bucket"
              exit 1
            fi
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled

            # Enable SSE on the bucket
            if [ -n "${{ secrets.TF_STATE_KMS_KEY_ARN }}" ]; then
              aws s3api put-bucket-encryption \
                --bucket "$BUCKET_NAME" \
                --server-side-encryption-configuration "{
                  \"Rules\": [{
                    \"ApplyServerSideEncryptionByDefault\": {
                      \"SSEAlgorithm\": \"aws:kms\",
                      \"KMSMasterKeyID\": \"${{ secrets.TF_STATE_KMS_KEY_ARN }}\"
                    },
                    \"BucketKeyEnabled\": true
                  }]
                }"
            else
              aws s3api put-bucket-encryption \
                --bucket "$BUCKET_NAME" \
                --server-side-encryption-configuration '{
                  "Rules": [{
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    },
                    "BucketKeyEnabled": true
                  }]
                }'
            fi
            
            if [ $? -ne 0 ]; then
              echo "❌ Failed to configure bucket versioning or encryption"
              exit 1
            fi
            
            echo "✅ Created and configured S3 bucket: $BUCKET_NAME"
          fi

      - name: Terraform Init
        run: |
          echo "Using backend configuration from Terraform code"
          terraform init -input=false

      - name: Export plan as JSON
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "${{ env.ENV_FILE }}" ]; then
            terraform plan -var-file=${{ env.ENV_FILE }} -out=tfplan.bin -input=false -no-color > /dev/null 2>&1
          else
            terraform plan -out=tfplan.bin -input=false -no-color > /dev/null 2>&1
          fi
          terraform show -json tfplan.bin > plan.json

      - name: Export Checkov results as JSON
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pip install checkov -q 2>/dev/null
          checkov -d . --framework terraform --output json > checkov_results.json 2>/dev/null || echo '{"results":{"failed_checks":[]}}' > checkov_results.json

      - name: Setup Infracost
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost diff
        if: github.event_name == 'pull_request'
        id: infracost
        continue-on-error: true
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "$INFRACOST_API_KEY" ] && [ -f plan.json ]; then
            infracost diff \
              --path plan.json \
              --format json \
              --out-file infracost.json 2>/dev/null || echo '{}' > infracost.json
          else
            echo '{}' > infracost.json
          fi

      - name: Build Infracost PR section
        if: github.event_name == 'pull_request'
        id: infracost_section
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json
          from pathlib import Path

          path = Path("infracost.json")
          out = Path("infracost-section.md")

          def money(value):
              try:
                  return "${:,.2f}".format(float(value or 0))
              except Exception:
                  return "$0.00"

          def diff_label(value):
              try:
                  diff = float(value or 0)
              except Exception:
                  diff = 0
              if diff > 0:
                  return "increase", "🔺 +{}/mo".format(money(diff))
              if diff < 0:
                  return "decrease", "🔻 {}/mo".format(money(diff))
              return "no change", "➡️  no change"

          if not path.exists():
              out.write_text("", encoding="utf-8")
              raise SystemExit(0)

          try:
              data = json.loads(path.read_text(encoding="utf-8") or "{}")
          except Exception:
              data = {}

          projects = data.get("projects", []) if isinstance(data, dict) else []
          if not projects:
              out.write_text("", encoding="utf-8")
              raise SystemExit(0)

          total = sum(float(p.get("totalMonthlyCost") or 0) for p in projects)
          past_total = sum(float(p.get("pastTotalMonthlyCost") or 0) for p in projects)
          diff_total = sum(float(p.get("diffTotalMonthlyCost") or 0) for p in projects)
          trend_name, trend = diff_label(diff_total)

          rows = []
          for project in projects:
              for resource in (project.get("breakdown") or {}).get("resources", []):
                  diff = resource.get("diffMonthlyCost")
                  monthly = resource.get("monthlyCost")
                  if diff in (None, "0", 0) and monthly in (None, "0", 0):
                      continue
                  rows.append("| `{}` | {} | {} |".format(
                      resource.get("name", "unknown"),
                      money(monthly),
                      money(diff),
                  ))

          rows_md = "\n".join(rows) if rows else "| — | — | — |"
          summary = [
              "### 💸 Infrastructure Cost Estimate",
              "",
              "| Metric | Amount |",
              "|---|---:|",
          ]
          if past_total:
              summary.append("| Previous monthly cost | {} |".format(money(past_total)))
          summary.extend([
              "| New monthly cost | **{}** |".format(money(total)),
              "| Monthly difference | **{}** |".format(trend),
              "",
              "<details>",
              "<summary>Per-resource cost changes ({})</summary>".format(trend_name),
              "",
              "| Resource | Monthly | Diff |",
              "|---|---:|---:|",
              rows_md,
              "",
              "</details>",
          ])

          out.write_text("\n".join(summary), encoding="utf-8")
          PYEOF

          if [ -s infracost-section.md ]; then
            {
              echo "INFRACOST_SECTION<<INFRACOST_EOF"
              cat infracost-section.md
              echo "INFRACOST_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Checkov
        if: github.event_name == 'pull_request'
        id: checkov
        uses: bridgecrewio/checkov-action@master
        continue-on-error: ${{ github.event.inputs.fail_on_security_issues != 'true' }}
        with:
          directory: .
          framework: terraform

      - name: Setup TFLint
        if: github.event_name == 'pull_request'
        uses: terraform-linters/setup-tflint@v3
        with:
          tflint_version: latest

      - name: Run TFLint
        if: github.event_name == 'pull_request'
        id: tflint
        continue-on-error: ${{ github.event.inputs.fail_on_security_issues != 'true' }}
        run: tflint --init && tflint

      - name: Run TFSec
        if: github.event_name == 'pull_request'
        id: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: ${{ github.event.inputs.fail_on_security_issues != 'true' }}
        with:
          working_directory: .

      - name: Terraform Plan
        id: plan
        shell: bash {0}
        run: |
          if [ -n "${{ env.ENV_FILE }}" ]; then
            terraform plan -var-file=${{ env.ENV_FILE }} -no-color -detailed-exitcode > plan_output.txt 2>&1
            PLAN_EXIT_CODE=$?
          else
            terraform plan -no-color -detailed-exitcode > plan_output.txt 2>&1
            PLAN_EXIT_CODE=$?
          fi
          
          # Read plan output
          PLAN_OUTPUT=$(cat plan_output.txt)
          
          # Set outputs
          echo "exit_code=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          {
            echo "PLAN_OUTPUT<<EOF"
            echo "$PLAN_OUTPUT"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          # Always exit 0 so step doesn't fail
          exit 0

      - name: Upload review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tf-review-artifacts
          path: |
            plan.json
            tfplan.bin
            checkov_results.json
            infracost.json
          retention-days: 1
      - name: Display Plan Results
        if: github.event_name != 'pull_request'
        run: |
          echo "📋 Terraform Plan Results:"
          echo "=========================="
          cat plan_output.txt
          echo "=========================="
          echo "Exit Code: ${{ steps.plan.outputs.exit_code }}"

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.PLAN_OUTPUT || 'Plan output not available' }}
          INFRACOST_SECTION: ${{ steps.infracost_section.outputs.INFRACOST_SECTION || '' }}
        with:
          script: |
            const plan = process.env.PLAN_OUTPUT;
            const planExitCode = '${{ steps.plan.outputs.exit_code }}';
            const checkovStatus = '${{ steps.checkov.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const tflintStatus  = '${{ steps.tflint.outcome }}'  === 'success' ? '✅ Passed' : '❌ Failed';
            const tfsecStatus   = '${{ steps.tfsec.outcome }}'   === 'success' ? '✅ Passed' : '❌ Failed';
            const checkovResults = process.env.CHECKOV_RESULTS || 'No detailed results available';

            let planStatus = '❌ Failed';
            if (planExitCode === '0') planStatus = '✅ No changes';
            else if (planExitCode === '2') planStatus = '📋 Changes detected';

            // Infracost is optional; include this only when the formatter produced content.
            const infracostSection = process.env.INFRACOST_SECTION
              ? process.env.INFRACOST_SECTION + '\n\n'
              : '';

            const nextStep = planExitCode === '2'
              ? '- ✅ Review changes above and merge to apply'
              : '- ℹ️ No infrastructure changes detected';

            const output =
              '## 🤖 Terraform Plan Review Bot\n\n' +
              '**Environment:** ${{ env.ENVIRONMENT }}\n' +
              '**AWS Region:** ${{ env.AWS_REGION }}\n' +
              '**Branch:** ${{ github.ref_name }}\n' +
              '**Plan Status:** ' + planStatus + '\n\n' +
              '### 🔍 Security Scan Results\n\n' +
              '<details>\n<summary><strong>Checkov:</strong> ' + checkovStatus + '</summary>\n\n' +
              '```\n' + checkovResults + '\n```\n</details>\n\n' +
              '<details>\n<summary><strong>TFLint:</strong> ' + tflintStatus + '</summary>\n\n' +
              '```\nTFLint scan completed - check workflow logs for detailed results\n```\n</details>\n\n' +
              '<details>\n<summary><strong>TFSec:</strong> ' + tfsecStatus + '</summary>\n\n' +
              '```\nTFSec scan completed - check workflow logs for detailed results\n```\n</details>\n\n' +
              infracostSection +
              '### 📋 Terraform Plan Output\n' +
              '<details>\n<summary>Click to view plan details</summary>\n\n' +
              '```terraform\n' + plan + '\n```\n</details>\n\n' +
              '### 🚀 Next Steps\n' +
              nextStep + '\n' +
              '- Monitor deployment in GitHub Actions after merge\n\n' +
              '---\n*🐘 Generated by Elephant TF CI Bot*';

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' && comment.body.includes('🤖 Terraform Plan Review Bot')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: output
                });
                console.log('Updated existing PR comment');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: output
                });
                console.log('Created new PR comment');
              }
            } catch (error) {
              console.error('Error posting PR comment:', error);
            }

  review:
    name: AI Review
    needs: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Download review artifacts
        uses: actions/download-artifact@v4
        with:
          name: tf-review-artifacts
          path: review-artifacts

      - name: Run AI review
        id: ai_review
        continue-on-error: true
        env:
          AI_REVIEW_PROVIDER: ${{ secrets.AI_REVIEW_PROVIDER || 'claude' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3-pro-preview' }}
          TF_WORKING_DIR: "."
          PLAN_JSON_PATH: "review-artifacts/plan.json"
          CHECKOV_JSON_PATH: "review-artifacts/checkov_results.json"
          INFRACOST_JSON_PATH: "review-artifacts/infracost.json"
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from urllib.parse import quote
          from pathlib import Path

          PROVIDER        = os.environ.get("AI_REVIEW_PROVIDER", "claude").strip().lower()
          ANTHROPIC_KEY   = os.environ.get("ANTHROPIC_API_KEY", "")
          GEMINI_KEY      = os.environ.get("GEMINI_API_KEY", "")
          CLAUDE_MODEL    = "claude-sonnet-4-6"
          GEMINI_MODEL    = os.environ.get("GEMINI_MODEL", "gemini-3-pro-preview")
          MAX_TOKENS      = 2500
          TF_DIR          = os.environ.get("TF_WORKING_DIR", ".")
          PLAN_FILE       = os.environ.get("PLAN_JSON_PATH", "review-artifacts/plan.json")
          CHECKOV_FILE    = os.environ.get("CHECKOV_JSON_PATH", "review-artifacts/checkov_results.json")
          INFRACOST_FILE  = os.environ.get("INFRACOST_JSON_PATH", "review-artifacts/infracost.json")
          OUTPUT_FILE     = "review_output.md"

          MAX_TF_CHARS        = 40000
          MAX_PLAN_CHARS      = 12000
          MAX_CHECKOV_CHARS   = 4000
          MAX_INFRACOST_CHARS = 2000

          SYSTEM_PROMPT = """You are a senior Terraform engineer conducting a thorough code review. You
          have 10+ years of experience writing production infrastructure at scale.
          Your reviews are direct, specific, and actionable — you name the exact
          resource and file, explain why the issue matters in production, and give a
          concrete fix. You do not pad findings with generic advice. If something is
          correct, you do not mention it.

          REVIEW CATEGORIES — check every one:

          [1] HARDCODED VALUES
          Flag any literal that should be dynamic:
          - AWS account IDs → data.aws_caller_identity.current.account_id
          - Region strings like "us-east-1" → data.aws_region.current.name or var.region
          - AMI IDs without a documented pin comment → data.aws_ami with filters
          - Environment-specific IP addresses / CIDRs → variables
          - ARNs containing account IDs or regions
          - Resource names with literal environment strings (e.g. "prod-bucket") → var.environment or locals
          - Any secret, password, token, or key in plaintext — CRITICAL
          - Instance types / port numbers that should vary by environment

          [2] VARIABLE QUALITY
          - Missing type constraint on any variable
          - Missing description on any variable
          - Missing validation block where inputs have a constrained domain
          - sensitive = true missing on secrets, tokens, passwords, private keys
          - Variables declared but never referenced
          - default = "" or default = null used instead of making the variable required
          - Inconsistent naming — all variables must be snake_case
          - Variables accepting any string when they should enforce an enum
          - Object type variables without attribute-level type definitions

          [3] DATA SOURCES — use instead of hardcoding
          - Account ID → data.aws_caller_identity.current.account_id
          - Region → data.aws_region.current.name
          - AMI → data.aws_ami with filters
          - Availability zones → data.aws_availability_zones.available
          - VPC / subnet IDs → data source lookup by tags
          - IAM policies as raw JSON strings → data.aws_iam_policy_document
          - SSM parameter values hardcoded → data.aws_ssm_parameter
          - Duplicate data source blocks with identical filters — deduplicate

          [4] LOCALS AND REPETITION
          - Same expression in 3+ places → extract to local
          - Tag blocks copy-pasted across resources → locals { common_tags = {} }
          - Same name interpolation pattern across resource names → local name_prefix
          - Near-identical resource blocks → for_each
          - count where for_each is more correct (count uses fragile index addressing)
          - Repeated inline maps/lists → local
          - Dynamic blocks missing where repeated nested blocks exist

          [5] MODULE DESIGN — single responsibility
          - Single responsibility: describe the module in one sentence without "and"
          - All meaningful configuration points exposed as variables
          - Output completeness: ARN, ID, name, security_group_id, endpoint, DNS name
          - Output naming: id, arn, name, endpoint, security_group_id (not "my_bucket_arn_output")
          - Pass-through modules with no added logic — flag as unnecessary wrapper
          - Cross-module coupling via data sources instead of variable inputs
          - Registry module sources without a version constraint
          - Provider blocks inside a module — belongs in root only

          [6] OUTPUTS
          - Every output must have a description
          - sensitive = true on outputs that expose secrets or tokens
          - Outputs exposing internal details callers do not need
          - Missing outputs a realistic caller would need
          - Output name doesn't match what it returns
          - Module with zero outputs (unless root module)

          [7] SECURITY AND IAM
          - "Action": "*" or "Resource": "*" in any IAM policy — CRITICAL
          - Trust policy "AWS": "*" without conditions
          - S3 bucket missing any of the four public access block settings
          - Security group 0.0.0.0/0 ingress on ports other than 80/443 — state the port
          - Missing server_side_encryption_configuration on S3
          - Unencrypted EBS volumes
          - RDS without storage_encrypted = true
          - Missing deletion_protection = true on stateful resources
          - KMS with enable_key_rotation = false

          [8] LIFECYCLE AND STATE SAFETY
          - Stateful resources without lifecycle { prevent_destroy = true }
          - Plan shows forces replacement — name the resource, explain blast radius
          - ignore_changes on attributes that must not be ignored
          - create_before_destroy missing where downtime would occur

          OUTPUT FORMAT:

          ## Terraform Review

          ### Summary
          One paragraph: what does this code do, resource/module/variable count, one honest quality sentence.

          ---

          ### Critical
          **[EXACT RESOURCE OR FILE] — [title]**
          What: what is wrong.
          Why: production consequence.
          Fix:
          ```hcl
          # corrected HCL
          ```

          ### High
          (same format)

          ### Medium
          (same format)

          ### Low / Style
          (same format)

          ### Module assessment
          **Module: [name]** — single responsibility: yes/no. Missing outputs: [list]. Missing inputs: [list]. Verdict: clean / needs refactor / over-engineered.

          ### What is correct
          Two to five specific bullet points.

          ### Verdict
          **APPROVE** | **APPROVE WITH CAUTION** | **BLOCK**
          One sentence justifying the verdict.

          `VERDICT_CODE: APPROVE|APPROVE_WITH_CAUTION|BLOCK`

          BEHAVIOUR RULES:
          - Name the exact resource/variable/output in every finding — never generic statements
          - Include a concrete HCL snippet for every finding
          - Omit any severity section with no findings
          - If plan shows forces replacement on a resource that also lacks prevent_destroy, escalate to Critical
          - Do not re-list Checkov findings — add narrative and blast radius context only
          - Infracost is optional enrichment. If there is no INFRACOST DIFF section, or it is empty, do not mention cost analysis or flag missing cost data.
          - Include a cost note under the verdict only if Infracost is present and shows >10% change or >$50/month delta
          - VERDICT_CODE must be the absolute last line with no trailing text"""

          def read_tf_sources(directory, max_chars):
              tf_files = sorted(Path(directory).rglob("*.tf"))
              if not tf_files:
                  return "(no .tf files found)"
              parts, total = [], 0
              for f in tf_files:
                  try:
                      content = f.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  header = f"\n\n### File: {f}\n"
                  block = header + content
                  if total + len(block) > max_chars:
                      remaining = max_chars - total
                      if remaining > len(header) + 200:
                          parts.append(header + content[:remaining - len(header)])
                          parts.append("\n...(truncated)")
                      break
                  parts.append(block)
                  total += len(block)
              return "".join(parts)

          def condense_plan(data):
              changes = [
                  {"address": c.get("address"), "type": c.get("type"),
                   "actions": c.get("change", {}).get("actions", []),
                   "after": c.get("change", {}).get("after")}
                  for c in data.get("resource_changes", [])
                  if c.get("change", {}).get("actions", []) != ["no-op"]
              ]
              return json.dumps({"terraform_version": data.get("terraform_version"),
                                 "resource_changes": changes}, indent=2)

          def condense_checkov(data):
              failed = data.get("results", {}).get("failed_checks", []) if isinstance(data, dict) else []
              return json.dumps({"failed_checks": [
                  {"check_id": c.get("check_id"), "resource": c.get("resource"),
                   "file": c.get("file_path"), "guideline": c.get("guideline", "")}
                  for c in failed
              ]}, indent=2)

          def condense_infracost(data):
              projects = data.get("projects", []) if isinstance(data, dict) else []
              top_level = {}
              if isinstance(data, dict):
                  top_level = {
                      "currency": data.get("currency"),
                      "past_monthly": data.get("pastTotalMonthlyCost"),
                      "current_monthly": data.get("totalMonthlyCost"),
                      "diff_monthly": data.get("diffTotalMonthlyCost"),
                  }
              summary = []
              for p in projects:
                  resources = [
                      {"name": r.get("name"), "monthly": r.get("monthlyCost"), "diff": r.get("diffMonthlyCost")}
                      for r in p.get("breakdown", {}).get("resources", [])
                      if r.get("diffMonthlyCost") not in (None, "0", 0) or r.get("monthlyCost") not in (None, "0", 0)
                  ]
                  summary.append({
                      "name": p.get("name"),
                      "currency": p.get("currency"),
                      "past_monthly": p.get("pastTotalMonthlyCost"),
                      "current_monthly": p.get("totalMonthlyCost"),
                      "diff_monthly": p.get("diffTotalMonthlyCost"),
                      "changed_resources": resources,
                  })
              return json.dumps({"total": top_level, "projects": summary}, indent=2)

          def read_optional(path, max_chars, label, condenser=None):
              p = Path(path)
              if not p.exists():
                  return ""
              try:
                  raw = p.read_text(encoding="utf-8")
                  if raw.strip() in ("", "{}"):
                      return ""
                  if condenser:
                      try:
                          raw = condenser(json.loads(raw))
                      except Exception:
                          pass
                  return f"\n\n--- {label} ---\n{raw[:max_chars]}"
              except Exception as e:
                  return f"\n\n--- {label} ---\n(error reading: {e})"

          def skip_review(message):
              Path(OUTPUT_FILE).write_text(f"> {message}", encoding="utf-8")
              print(message, file=sys.stderr)
              sys.exit(0)

          def call_claude(user_message):
              if not ANTHROPIC_KEY:
                  skip_review("ANTHROPIC_API_KEY not set — skipping AI review.")
              payload = json.dumps({
                  "model": CLAUDE_MODEL, "max_tokens": MAX_TOKENS,
                  "system": SYSTEM_PROMPT,
                  "messages": [{"role": "user", "content": user_message}]
              }).encode()
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages", data=payload,
                  headers={"x-api-key": ANTHROPIC_KEY, "anthropic-version": "2023-06-01",
                           "content-type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return json.loads(resp.read())["content"][0]["text"]
              except urllib.error.HTTPError as e:
                  print(f"Claude API error {e.code}: {e.read().decode()}", file=sys.stderr)
                  sys.exit(0)

          def call_gemini(user_message):
              if not GEMINI_KEY:
                  skip_review("GEMINI_API_KEY not set — skipping AI review.")
              payload = json.dumps({
                  "systemInstruction": {"parts": [{"text": SYSTEM_PROMPT}]},
                  "contents": [{"role": "user", "parts": [{"text": user_message}]}],
                  "generationConfig": {
                      "maxOutputTokens": MAX_TOKENS,
                      "temperature": 0.2,
                  },
              }).encode()
              model = quote(GEMINI_MODEL, safe="")
              api_key = quote(GEMINI_KEY, safe="")
              req = urllib.request.Request(
                  f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}",
                  data=payload,
                  headers={"content-type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      data = json.loads(resp.read())
                      parts = data.get("candidates", [{}])[0].get("content", {}).get("parts", [])
                      text = "".join(part.get("text", "") for part in parts)
                      return text or "Gemini returned an empty review."
              except urllib.error.HTTPError as e:
                  print(f"Gemini API error {e.code}: {e.read().decode()}", file=sys.stderr)
                  sys.exit(0)

          def call_ai_review(user_message):
              if PROVIDER == "disabled":
                  skip_review("AI review disabled by AI_REVIEW_PROVIDER.")
              if PROVIDER == "gemini":
                  return call_gemini(user_message)
              if PROVIDER == "claude":
                  return call_claude(user_message)
              skip_review(f"Unknown AI_REVIEW_PROVIDER '{PROVIDER}' — skipping AI review.")

          def extract_verdict(text):
              for line in reversed(text.splitlines()):
                  line = line.strip().strip("`")
                  if line.startswith("VERDICT_CODE:"):
                      code = line.split(":", 1)[1].strip()
                      if code in ("APPROVE", "APPROVE_WITH_CAUTION", "BLOCK"):
                          return code
              return "APPROVE_WITH_CAUTION"

          tf_source     = read_tf_sources(TF_DIR, MAX_TF_CHARS)
          plan_sec      = read_optional(PLAN_FILE,       MAX_PLAN_CHARS,     "TERRAFORM PLAN",   condense_plan)
          checkov_sec   = read_optional(CHECKOV_FILE,    MAX_CHECKOV_CHARS,  "CHECKOV FINDINGS", condense_checkov)
          infracost_sec = read_optional(INFRACOST_FILE,  MAX_INFRACOST_CHARS, "INFRACOST DIFF",  condense_infracost)

          cost_context = "\n\n--- COST CONTEXT ---\nInfracost is optional in this pipeline. If no INFRACOST DIFF section is included, cost data was disabled, unavailable, or empty; do not treat that as a problem."
          user_msg = f"Review the following Terraform code.\n\n--- TERRAFORM SOURCE ---\n{tf_source}{plan_sec}{checkov_sec}{infracost_sec}{cost_context}"

          print(f"Running AI review with {PROVIDER}...")
          review  = call_ai_review(user_msg)
          verdict = extract_verdict(review)
          print(f"Verdict: {verdict}")

          badge_map = {
              "APPROVE":              "✅ APPROVED",
              "APPROVE_WITH_CAUTION": "⚠️ APPROVE WITH CAUTION",
              "BLOCK":                "🚫 BLOCKED — do not merge",
          }
          badge  = badge_map.get(verdict, "⚠️ REVIEW REQUIRED")
          output = f"**{badge}**\n\n<details><summary>View full AI review</summary>\n\n{review}\n\n</details>"

          Path(OUTPUT_FILE).write_text(output, encoding="utf-8")
          print(f"Written to {OUTPUT_FILE}")

          if verdict == "BLOCK":
              print("BLOCK verdict — exiting 1 to fail the pipeline step.")
              sys.exit(1)
          PYEOF

      - name: Append review to PR comment
        if: always()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let reviewContent = '';
            try {
              reviewContent = fs.readFileSync('review_output.md', 'utf8');
            } catch (e) {
              reviewContent = '> AI review could not be generated. Check the workflow logs.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('🤖 Terraform Plan Review Bot')
            );

            const marker = '\n\n---\n### 🧠 AI Review';

            if (existing) {
              let body = existing.body;
              const idx = body.indexOf(marker);
              if (idx !== -1) body = body.substring(0, idx);
              body += `${marker}\n\n${reviewContent}`;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### 🧠 AI Review\n\n${reviewContent}`,
              });
            }

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: review_output.md
          retention-days: 30

      - name: Block on critical verdict
        if: steps.ai_review.outcome == 'failure'
        run: |
          echo "AI review returned BLOCK verdict. Resolve critical findings before merging."
          exit 1

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    # To gate apply on review verdict, add `review` to the needs list.
    # This requires changing the apply trigger to workflow_dispatch or
    # using a GitHub environment with required reviewers instead.
    # Only run when a PR is merged. Never on direct push or feature branches.
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      !startsWith(github.head_ref, 'feature/')

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ github.event.inputs.aws_region || secrets.AWS_REGION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set AWS Role and Environment
        id: set-role
        run: |
          # Use input role ARN or default pipeline role ARN
          if [ -n "${{ github.event.inputs.role_arn }}" ]; then
            ROLE_ARN="${{ github.event.inputs.role_arn }}"
            echo "Using input role ARN"
          else
            ROLE_ARN="${{ secrets.PIPELINE_ROLE_ARN }}"
            echo "Using pipeline role ARN"
          fi
          
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV
          echo "Selected ROLE_ARN: $ROLE_ARN"
          
          if [ -z "$ROLE_ARN" ] || [ "$ROLE_ARN" = "" ]; then
            echo "ERROR: No role ARN configured. Please set PIPELINE_ROLE_ARN secret or provide role_arn input."
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Select .tfvars File and Detect Environment
        run: |
          # Find first .tfvars file
          TFVARS_FILE=$(find . -name "*.tfvars" -type f | head -1)
          
          # Initialize environment from manual input
          ENV="${{ github.event.inputs.environment }}"
          BRANCH="${{ github.ref_name }}"
          
          if [ -n "$TFVARS_FILE" ]; then
            echo "ENV_FILE=$TFVARS_FILE" >> $GITHUB_ENV
            echo "Using tfvars file: $TFVARS_FILE"
            
            # Try to detect environment from tfvars file (check both 'environment' and 'env')
            if [ -f "$TFVARS_FILE" ]; then
              DETECTED_ENV=$(grep -E '^[[:space:]]*(environment|env)[[:space:]]*=' "$TFVARS_FILE" | sed 's/.*=[[:space:]]*"\([^"]*\)".*/\1/' | head -1)
              if [ -n "$DETECTED_ENV" ]; then
                ENV="$DETECTED_ENV"
                echo "Detected environment from tfvars: $DETECTED_ENV"
              fi
            fi
          else
            echo "No .tfvars files found - continuing without variable file"
          fi
          
          # Use branch name if no environment detected from tfvars or manual input
          if [ -z "$ENV" ]; then
            ENV="$BRANCH"
            echo "Using branch name as environment: $ENV"
          fi
          
          echo "ENVIRONMENT=$ENV" >> $GITHUB_ENV
          echo "Final environment: $ENV"

      - name: Ensure S3 Bucket Exists
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        if: env.TF_STATE_BUCKET != ''
        run: |
          BUCKET_NAME="$TF_STATE_BUCKET"
          echo "🪣 Creating S3 bucket: $BUCKET_NAME"
          
          # Check if bucket exists
          if aws s3 ls "s3://$BUCKET_NAME" 2>/dev/null; then
            echo "✅ Bucket $BUCKET_NAME already exists"
          else
            echo "Creating bucket $BUCKET_NAME..."
            # Create bucket
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3 mb "s3://$BUCKET_NAME"
            else
              aws s3 mb "s3://$BUCKET_NAME" --region "${{ env.AWS_REGION }}"
            fi
            
            if [ $? -ne 0 ]; then
              echo "❌ Failed to create bucket"
              exit 1
            fi
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled

            # Enable SSE on the bucket
            if [ -n "${{ secrets.TF_STATE_KMS_KEY_ARN }}" ]; then
              aws s3api put-bucket-encryption \
                --bucket "$BUCKET_NAME" \
                --server-side-encryption-configuration "{
                  \"Rules\": [{
                    \"ApplyServerSideEncryptionByDefault\": {
                      \"SSEAlgorithm\": \"aws:kms\",
                      \"KMSMasterKeyID\": \"${{ secrets.TF_STATE_KMS_KEY_ARN }}\"
                    },
                    \"BucketKeyEnabled\": true
                  }]
                }"
            else
              aws s3api put-bucket-encryption \
                --bucket "$BUCKET_NAME" \
                --server-side-encryption-configuration '{
                  "Rules": [{
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    },
                    "BucketKeyEnabled": true
                  }]
                }'
            fi
            
            if [ $? -ne 0 ]; then
              echo "❌ Failed to configure bucket versioning or encryption"
              exit 1
            fi
            
            echo "✅ Created and configured S3 bucket: $BUCKET_NAME"
          fi

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tf-review-artifacts

      - name: Terraform Init
        run: |
          echo "Using backend configuration from Terraform code"
          terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.bin
